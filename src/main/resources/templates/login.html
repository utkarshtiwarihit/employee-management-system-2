<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WorkSync • Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 text-white rounded-2xl font-bold text-xl shadow-lg shadow-blue-500/20 mb-3">
                W
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">WorkSync HQ</h1>
            <p class="text-sm text-slate-500 mt-1">Smart Enterprise Timekeeping</p>
        </div>

        <div th:if="${param.error}" class="p-3 mb-5 text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl">
            Invalid email or password. Please try again.
        </div>

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Corporate Email</label>
                <input type="email" name="email" required placeholder="user@worksync.com"
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
            </div>
            <button type="submit" class="w-full py-3 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition shadow-lg shadow-blue-600/20 text-sm">
                Sign In to WorkSpace
            </button>
        </form>
    </div>
</body>
</html>
