<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Desk • WorkSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 sm:p-10">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Top Nav -->
        <header class="flex justify-between items-center bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-slate-900" th:text="${user.name}">Employee</h1>
                <p class="text-sm text-slate-500" th:text="${user.designation} + ' • ' + ${user.email}"></p>
            </div>
            <a href="/logout" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-xl transition">Sign Out</a>
        </header>

        <!-- Stats Bar (IST Clock + 18 Annual Leave Quota) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Live Local Clock (IST)</p>
                <p id="liveClock" class="text-3xl font-bold font-mono text-blue-600 mt-2">--:--:--</p>
            </div>
            
            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col justify-between gap-4">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Annual Leave Quota (18 Days)</p>
                        <div class="flex items-baseline gap-2 mt-1">
                            <span class="text-2xl font-bold text-slate-900" th:text="${18.0 - (user.leavesTaken != null ? user.leavesTaken : 0.0)} + ' Left'">18.0 Left</span>
                            <span class="text-xs text-slate-500 font-medium" th:text="'(' + ${user.leavesTaken != null ? user.leavesTaken : 0.0} + ' used)'"></span>
                        </div>
                    </div>
                    <span th:if="${(user.leavesTaken != null ? user.leavesTaken : 0.0) >= 18.0}" 
                          class="px-2.5 py-1 text-xs rounded-lg font-semibold bg-rose-50 text-rose-700 border border-rose-200">
                        Exhausted
                    </span>
                    <span th:if="${(user.leavesTaken != null ? user.leavesTaken : 0.0) < 18.0}" 
                          class="px-2.5 py-1 text-xs rounded-lg font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                        Max 18/Year
                    </span>
                </div>
                
                <form action="/employee/apply-leave" method="post" class="flex gap-2">
                    <select name="days" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none">
                        <option value="0.5">0.5 Day (Half)</option>
                        <option value="1.0" selected>1.0 Day (Full)</option>
                    </select>
                    <button type="submit" 
                            th:disabled="${(user.leavesTaken != null ? user.leavesTaken : 0.0) >= 18.0}"
                            th:classappend="${(user.leavesTaken != null ? user.leavesTaken : 0.0) >= 18.0} ? 'opacity-50 cursor-not-allowed bg-slate-400' : 'bg-amber-500 hover:bg-amber-600 text-white shadow-md shadow-amber-500/20'"
                            class="px-4 py-2 rounded-xl text-sm font-medium transition">
                        Apply Leave
                    </button>
                </form>
            </div>
        </div>

        <!-- Punch Desk -->
        <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h2 class="text-base font-bold text-slate-900">Attendance Terminal</h2>
                <p class="text-sm text-slate-500">Record check-in and check-out to compute working duration.</p>
            </div>
            <div>
                <form th:if="${todayRecord == null}" action="/employee/punch-in" method="post">
                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold shadow-md shadow-emerald-600/20 transition text-sm">
                        Punch In
                    </button>
                </form>
                <form th:if="${todayRecord != null and todayRecord.status == 'IN'}" action="/employee/punch-out" method="post">
                    <button type="submit" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-semibold shadow-md shadow-rose-600/20 transition text-sm">
                        Punch Out
                    </button>
                </form>
                <div th:if="${todayRecord != null and todayRecord.status == 'COMPLETED'}" class="px-4 py-2 bg-slate-100 border border-slate-200 text-slate-700 rounded-xl text-sm font-medium">
                    ✓ Logged for Today (<span th:text="${todayRecord.totalWorkingHours}"></span>)
                </div>
            </div>
        </div>

        <!-- Timeline Log -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
            <h3 class="font-bold text-slate-900 mb-4 text-base">Personal Punch History</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-xs uppercase text-slate-400 border-b border-slate-100">
                        <tr>
                            <th class="pb-3">Date</th>
                            <th class="pb-3">In</th>
                            <th class="pb-3">Out</th>
                            <th class="pb-3">Duration</th>
                            <th class="pb-3">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="att : ${history}">
                            <td class="py-3.5 font-medium text-slate-900" th:text="${att.date}"></td>
                            <td class="py-3.5 text-slate-600" th:text="${att.checkInTime}">--</td>
                            <td class="py-3.5 text-slate-600" th:text="${att.checkOutTime != null ? att.checkOutTime : '--'}">--</td>
                            <td class="py-3.5 text-blue-600 font-medium" th:text="${att.totalWorkingHours != null ? att.totalWorkingHours : '--'}"></td>
                            <td class="py-3.5">
                                <span th:class="${att.status == 'COMPLETED' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200'} + ' px-2.5 py-1 text-xs border rounded-lg font-medium'"
                                      th:text="${att.status}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function refreshTime() {
            document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true });
        }
        setInterval(refreshTime, 1000);
        refreshTime();
    </script>
</body>
</html>
